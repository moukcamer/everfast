services:
  - type: web
    name: monprojet-django
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn monprojet.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: monprojet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
    autoDeploy: true

databases:
  - name: monprojet-db
    plan: free