{% extends 'Fango/base.html' %}

{% block title %}Recadrer la photo - {{ membre.nom_complet }}{% endblock %}

{% block styles %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css">
<style>
    .crop-container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 20px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .crop-header {
        text-align: center;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid #f0f0f0;
    }
    
    .crop-wrapper {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 2rem;
    }
    
    @media (max-width: 992px) {
        .crop-wrapper {
            grid-template-columns: 1fr;
        }
    }
    
    .image-container {
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
        background: #f8f8f8;
        min-height: 500px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    #imageToCrop {
        max-width: 100%;
        max-height: 600px;
    }
    
    .controls-container {
        padding: 1.5rem;
        background: #f8f9fa;
        border-radius: 8px;
    }
    
    .control-group {
        margin-bottom: 1.5rem;
    }
    
    .control-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: #333;
    }
    
    .slider-container {
        display: flex;
        align-items: center;
        gap: 1rem;
    }
    
    .slider-container input[type="range"] {
        flex-grow: 1;
    }
    
    .slider-value {
        min-width: 40px;
        text-align: center;
        font-weight: bold;
        color: #667eea;
    }
    
    .preview-container {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        overflow: hidden;
        margin: 0 auto 1rem;
        border: 3px solid #667eea;
    }
    
    .preview-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    
    .btn-group {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
    }
    
    .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.3s;
        flex: 1;
    }
    
    .btn-primary {
        background: #667eea;
        color: white;
    }
    
    .btn-primary:hover {
        background: #5a67d8;
        transform: translateY(-2px);
    }
    
    .btn-secondary {
        background: #e2e8f0;
        color: #333;
    }
    
    .btn-secondary:hover {
        background: #cbd5e0;
    }
    
    .aspect-ratio-buttons {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }
    
    .ratio-btn {
        padding: 8px 16px;
        background: #edf2f7;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s;
    }
    
    .ratio-btn.active {
        background: #667eea;
        color: white;
    }
    
    .loading-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.7);
        z-index: 1000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
    }
    
    .loading-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="crop-container">
        <div class="crop-header">
            <h1><i class="fas fa-crop-alt"></i> Recadrer la photo</h1>
            <p>Recadrez la photo de profil de <strong>{{ membre.nom_complet }}</strong></p>
        </div>
        
        <div class="crop-wrapper">
            <!-- Zone de recadrage -->
            <div class="image-container">
                <img id="imageToCrop" src="{{ photo_url }}" alt="Photo à recadrer">
            </div>
            
            <!-- Contrôles -->
            <div class="controls-container">
                <!-- Aperçu -->
                <div class="control-group">
                    <label>Aperçu du recadrage :</label>
                    <div class="preview-container">
                        <img id="cropPreview" src="{{ photo_url }}" alt="Aperçu">
                    </div>
                </div>
                
                <!-- Ratio d'aspect -->
                <div class="control-group">
                    <label>Ratio d'aspect :</label>
                    <div class="aspect-ratio-buttons">
                        <button type="button" class="ratio-btn active" data-ratio="1">1:1 (Carré)</button>
                        <button type="button" class="ratio-btn" data-ratio="4/3">4:3</button>
                        <button type="button" class="ratio-btn" data-ratio="16/9">16:9</button>
                        <button type="button" class="ratio-btn" data-ratio="free">Libre</button>
                    </div>
                </div>
                
                <!-- Zoom -->
                <div class="control-group">
                    <label>Zoom :</label>
                    <div class="slider-container">
                        <input type="range" id="zoomSlider" min="0.1" max="3" step="0.1" value="1">
                        <span class="slider-value" id="zoomValue">1.0x</span>
                    </div>
                </div>
                
                <!-- Rotation -->
                <div class="control-group">
                    <label>Rotation :</label>
                    <div class="slider-container">
                        <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0">
                        <span class="slider-value" id="rotateValue">0°</span>
                    </div>
                </div>
                
                <!-- Position X -->
                <div class="control-group">
                    <label>Position X :</label>
                    <div class="slider-container">
                        <input type="range" id="posXSlider" min="0" max="100" step="1" value="0">
                        <span class="slider-value" id="posXValue">0%</span>
                    </div>
                </div>
                
                <!-- Position Y -->
                <div class="control-group">
                    <label>Position Y :</label>
                    <div class="slider-container">
                        <input type="range" id="posYSlider" min="0" max="100" step="1" value="0">
                        <span class="slider-value" id="posYValue">0%</span>
                    </div>
                </div>
                
                <!-- Boutons d'action -->
                <div class="btn-group">
                    <button type="button" class="btn btn-primary" id="cropBtn">
                        <i class="fas fa-check"></i> Appliquer le recadrage
                    </button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn">
                        <i class="fas fa-times"></i> Annuler
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Overlay de chargement -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <p>Recadrage en cours...</p>
</div>

<!-- Bibliothèques -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    let cropper;
    const image = document.getElementById('imageToCrop');
    const preview = document.getElementById('cropPreview');
    
    // Initialiser Cropper.js
    cropper = new Cropper(image, {
        aspectRatio: 1,
        viewMode: 1,
        autoCropArea: 0.8,
        responsive: true,
        restore: true,
        checkCrossOrigin: false,
        background: false,
        modal: true,
        guides: true,
        center: true,
        highlight: false,
        cropBoxMovable: true,
        cropBoxResizable: true,
        toggleDragModeOnDblclick: false,
        
        ready: function() {
            // Mettre à jour l'aperçu
            updatePreview();
        },
        
        crop: function(event) {
            // Mettre à jour les sliders avec les valeurs actuelles
            updateSlidersFromCropper();
            // Mettre à jour l'aperçu
            updatePreview();
        }
    });
    
    // Mettre à jour l'aperçu
    function updatePreview() {
        const canvas = cropper.getCroppedCanvas({
            width: 150,
            height: 150
        });
        
        if (canvas) {
            preview.src = canvas.toDataURL('image/jpeg', 0.9);
        }
    }
    
    // Mettre à jour les sliders avec les valeurs du cropper
    function updateSlidersFromCropper() {
        const cropBoxData = cropper.getCropBoxData();
        const canvasData = cropper.getCanvasData();
        
        if (cropBoxData && canvasData) {
            // Calculer les positions en pourcentage
            const posXPercent = (cropBoxData.left / canvasData.width) * 100;
            const posYPercent = (cropBoxData.top / canvasData.height) * 100;
            
            // Mettre à jour les sliders
            document.getElementById('posXSlider').value = posXPercent;
            document.getElementById('posYSlider').value = posYPercent;
            document.getElementById('zoomSlider').value = canvasData.scaleX;
            
            // Mettre à jour les affichages
            document.getElementById('posXValue').textContent = Math.round(posXPercent) + '%';
            document.getElementById('posYValue').textContent = Math.round(posYPercent) + '%';
            document.getElementById('zoomValue').textContent = canvasData.scaleX.toFixed(1) + 'x';
            document.getElementById('rotateValue').textContent = Math.round(cropper.getData().rotate) + '°';
        }
    }
    
    // Contrôles de ratio
    document.querySelectorAll('.ratio-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            // Désactiver tous les boutons
            document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
            // Activer le bouton cliqué
            this.classList.add('active');
            
            // Appliquer le ratio
            const ratio = this.dataset.ratio;
            if (ratio === 'free') {
                cropper.setAspectRatio(NaN);
            } else if (ratio === '4/3') {
                cropper.setAspectRatio(4/3);
            } else if (ratio === '16/9') {
                cropper.setAspectRatio(16/9);
            } else {
                cropper.setAspectRatio(1);
            }
        });
    });
    
    // Contrôle de zoom
    document.getElementById('zoomSlider').addEventListener('input', function(e) {
        const scale = parseFloat(e.target.value);
        cropper.scale(scale, scale);
        document.getElementById('zoomValue').textContent = scale.toFixed(1) + 'x';
    });
    
    // Contrôle de rotation
    document.getElementById('rotateSlider').addEventListener('input', function(e) {
        const rotate = parseInt(e.target.value);
        cropper.rotateTo(rotate);
        document.getElementById('rotateValue').textContent = rotate + '°';
    });
    
    // Contrôle position X
    document.getElementById('posXSlider').addEventListener('input', function(e) {
        const percent = parseInt(e.target.value);
        const canvasData = cropper.getCanvasData();
        const newLeft = (percent / 100) * canvasData.width;
        const cropBoxData = cropper.getCropBoxData();
        cropper.setCropBoxData({
            left: newLeft
        });
        document.getElementById('posXValue').textContent = percent + '%';
    });
    
    // Contrôle position Y
    document.getElementById('posYSlider').addEventListener('input', function(e) {
        const percent = parseInt(e.target.value);
        const canvasData = cropper.getCanvasData();
        const newTop = (percent / 100) * canvasData.height;
        const cropBoxData = cropper.getCropBoxData();
        cropper.setCropBoxData({
            top: newTop
        });
        document.getElementById('posYValue').textContent = percent + '%';
    });
    
    // Bouton d'annulation
    document.getElementById('cancelBtn').addEventListener('click', function() {
        window.location.href = "{% url 'apropos' %}";
    });
    
    // Bouton de recadrage
    document.getElementById('cropBtn').addEventListener('click', function() {
        // Afficher le loader
        document.getElementById('loadingOverlay').style.display = 'flex';
        
        // Récupérer les données de recadrage
        const cropData = cropper.getData(true); // true pour les pourcentages
        
        // Préparer les données à envoyer
        const data = {
            x: cropData.x,
            y: cropData.y,
            width: cropData.width,
            height: cropData.height,
            rotate: cropData.rotate || 0,
            scaleX: cropper.getCanvasData().scaleX,
            scaleY: cropper.getCanvasData().scaleY
        };
        
        // Envoyer la requête au serveur
        fetch("{% url 'crop_photo_equipe' membre.id %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            document.getElementById('loadingOverlay').style.display = 'none';
            
            if (result.success) {
                alert('Photo recadrée avec succès !');
                window.location.href = "{% url 'apropos' %}";
            } else {
                alert('Erreur: ' + result.error);
            }
        })
        .catch(error => {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert('Erreur réseau: ' + error.message);
        });
    });
    
    // Initialiser les valeurs des sliders
    updateSlidersFromCropper();
});
</script>
{% endblock %}
