<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ image.nom }} - Fango</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 30px 0;
            color: white;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .image-detail-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }
        
        .image-display {
            width: 100%;
            max-height: 600px;
            overflow: hidden;
        }
        
        .image-display img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .image-info {
            padding: 40px;
        }
        
        .image-title {
            font-size: 2rem;
            color: #2d3748;
            margin-bottom: 20px;
        }
        
        .image-description {
            color: #718096;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        
        .image-meta {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .meta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .meta-label {
            font-size: 0.9rem;
            color: #a0aec0;
            margin-bottom: 5px;
        }
        
        .meta-value {
            font-weight: 600;
            color: #4a5568;
        }
        
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .nav-link {
            text-decoration: none;
            color: white;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        
        .nav-link:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        
        .back-btn {
            margin-bottom: 30px;
        }
        
        .back-btn a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .back-btn a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(-5px);
        }
        
        @media (max-width: 768px) {
            .image-info {
                padding: 20px;
            }
            
            .image-title {
                font-size: 1.5rem;
            }
            
            .image-meta {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-btn">
            <a href="{% url 'image_gallery' %}">← Retour à la galerie</a>
        </div>
        
        <div class="header">
            <h1>Détails de l'image</h1>
        </div>
        
        <div class="image-detail-container">
            <div class="image-display">
                <img src="{{ image.fichier.url }}" alt="{{ image.nom }}">
            </div>
            
            <div class="image-info">
                <h1 class="image-title">{{ image.nom }}</h1>
                
                {% if image.description %}
                    <p class="image-description">{{ image.description }}</p>
                {% endif %}
                
                <div class="image-meta">
                    <div class="meta-item">
                        <span class="meta-label">Uploadé le</span>
                        <span class="meta-value">{{ image.date_upload|date:"d/m/Y" }}</span>
                    </div>
                    
                    <div class="meta-item">
                        <span class="meta-label">Heure</span>
                        <span class="meta-value">{{ image.date_upload|date:"H:i" }}</span>
                    </div>
                    
                    <div class="meta-item">
                        <span class="meta-label">Format</span>
                        <span class="meta-value">{{ image.fichier.url|slice:"-3:"|upper }}</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="nav-links">
            <a href="{% url 'accueil' %}" class="nav-link">🏠 Accueil</a>
            <a href="{% url 'article_list' %}" class="nav-link">📝 Articles</a>
            <a href="{% url 'image_gallery' %}" class="nav-link">🖼️ Galerie</a>
        </div>
    </div>
</body>
</html>
