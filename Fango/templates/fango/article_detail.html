<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.titre }} - Fango</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .article-header {
            background: white;
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .article-category {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        
        .article-title {
            font-size: 2.5rem;
            color: #2d3748;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        
        .article-meta {
            display: flex;
            gap: 20px;
            color: #a0aec0;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .article-image {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .article-content {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .article-body {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #4a5568;
        }
        
        .article-body p {
            margin-bottom: 20px;
        }
        
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        
        .nav-link {
            text-decoration: none;
            color: white;
            font-weight: 600;
            padding: 12px 30px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        
        .nav-link:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        
        .back-btn {
            margin-bottom: 30px;
        }
        
        .back-btn a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .back-btn a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(-5px);
        }
        
        @media (max-width: 768px) {
            .article-title {
                font-size: 2rem;
            }
            
            .article-header,
            .article-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="back-btn">
            <a href="{% url 'article_list' %}">← Retour aux articles</a>
        </div>
        
        <div class="article-header">
            <span class="article-category">{{ article.categorie.nom }}</span>
            <h1 class="article-title">{{ article.titre }}</h1>
            <div class="article-meta">
                <span>👤 {{ article.auteur.username }}</span>
                <span>📅 {{ article.date_publication|date:"d/m/Y" }}</span>
            </div>
            
            {% if article.image %}
                <img src="{{ article.image.url }}" alt="{{ article.titre }}" class="article-image">
            {% endif %}
        </div>
        
        <div class="article-content">
            <div class="article-body">
                {{ article.contenu|linebreaks }}
            </div>
        </div>
        
        <div class="nav-links">
            <a href="{% url 'accueil' %}" class="nav-link">🏠 Accueil</a>
            <a href="{% url 'article_list' %}" class="nav-link">📝 Articles</a>
            <a href="{% url 'image_gallery' %}" class="nav-link">🖼️ Galerie</a>
        </div>
    </div>
</body>
</html>
